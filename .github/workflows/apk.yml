name: Build Android APK
on:
  push:
    branches: [main]
    paths-ignore: ['source/**', 'README.md', 'godot/**', '.github/workflows/godot-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Pack the game into the app
        run: |
          W=android/app/src/main/assets/www
          mkdir -p $W
          cp -r index.html lib map cars data icons $W/
          # no service worker inside the app: files are already local
          sed -i '/serviceWorker/d' $W/index.html
          du -sh $W
      - name: Build
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk aurelia-island.apk && ls -la aurelia-island.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Aurelia Island APK ${{ github.run_number }}
          make_latest: true
          files: aurelia-island.apk
          body: Full game, offline. Install on Android (allow "Install unknown apps" for your browser or file manager).
