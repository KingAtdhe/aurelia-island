name: Build Godot APK
on:
  push:
    branches: [main]
    paths: ['godot/**', '.github/workflows/godot-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: godot-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Godot and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip && mv Godot_v${GODOT_VERSION}_linux.x86_64 godot-bin
          T=~/.local/share/godot/export_templates/${GODOT_VERSION/-stable/.stable}
          mkdir -p $T && unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz && mv templates/* $T/
          ls $T | head
      - name: Editor settings (Android SDK, Java, debug key)
        run: |
          keytool -genkeypair -v -keystore $HOME/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          V=$(echo $GODOT_VERSION | cut -d. -f1,2)
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-$V.tres <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-$V.tres
      - name: Import and export
        run: |
          cd godot && mkdir -p build
          ../godot-bin --headless --import . || true
          ../godot-bin --headless --export-debug "Android" build/aurelia-godot.apk
          ls -la build
      - name: Deflate textures, align and re-sign
        run: |
          BT=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -1); echo "build-tools: $BT"
          python3 .github/scripts/repack_apk.py godot/build/aurelia-godot.apk /tmp/repacked.apk
          $BT/zipalign -p -f 4 /tmp/repacked.apk /tmp/aligned.apk
          $BT/apksigner sign --ks $HOME/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out godot/build/aurelia-godot.apk /tmp/aligned.apk
          $BT/apksigner verify --verbose godot/build/aurelia-godot.apk | head -6
          $BT/zipalign -c -p 4 godot/build/aurelia-godot.apk && echo aligned
          ls -la godot/build
      - name: Lite APK (halved textures, starts on LOW)
        run: |
          BT=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -1)
          rm -rf /tmp/lite && mkdir -p /tmp/lite && cp -r godot /tmp/lite/godot && rm -rf /tmp/lite/godot/build /tmp/lite/godot/.godot
          pip install --quiet pillow || true
          python3 .github/scripts/lite.py /tmp/lite/godot
          cd /tmp/lite/godot && mkdir -p build
          $GITHUB_WORKSPACE/godot-bin --headless --import . || true
          $GITHUB_WORKSPACE/godot-bin --headless --export-debug "Android" build/aurelia-godot-lite.apk
          python3 $GITHUB_WORKSPACE/.github/scripts/repack_apk.py build/aurelia-godot-lite.apk /tmp/lite_repacked.apk
          $BT/zipalign -p -f 4 /tmp/lite_repacked.apk /tmp/lite_aligned.apk
          $BT/apksigner sign --ks $HOME/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out $GITHUB_WORKSPACE/godot/build/aurelia-godot-lite.apk /tmp/lite_aligned.apk
          ls -la $GITHUB_WORKSPACE/godot/build
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-apk-${{ github.run_number }}
          name: Aurelia Island (Godot) ${{ github.run_number }}
          make_latest: false
          files: |
            godot/build/aurelia-godot.apk
            godot/build/aurelia-godot-lite.apk
          body: Godot version of Aurelia Island (work in progress). Installs next to the web-based app. aurelia-godot-lite.apk is the smaller download for older phones (half-size textures, starts on LOW).
