<html><body style="margin:0;background:#888"><script src="lib/three.min.js"></script><script src="lib/GLTFLoader.js"></script><script src="lib/meshopt_decoder.js"></script><script>
const T3=THREE, R=new T3.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); R.setSize(1200,700); R.outputEncoding=T3.sRGBEncoding; R.toneMapping=T3.ACESFilmicToneMapping; R.toneMappingExposure=1.0; R.shadowMap.enabled=true; R.shadowMap.type=T3.PCFSoftShadowMap; document.body.appendChild(R.domElement);
const S=new T3.Scene(); S.background=new T3.Color(0xb9c4cf);
// studio environment: bright sky dome, a few soft panels, darker ground
const es=new T3.Scene(); const sg=new T3.SphereGeometry(50,32,16), cols=[]; const p=sg.attributes.position;
for(let i=0;i<p.count;i++){const y=p.getY(i)/50; const c=y>0?new T3.Color().setRGB(0.75+0.25*y,0.8+0.2*y,0.88+0.12*y):new T3.Color().setRGB(0.22,0.21,0.2); cols.push(c.r,c.g,c.b);} sg.setAttribute('color',new T3.Float32BufferAttribute(cols,3));
es.add(new T3.Mesh(sg,new T3.MeshBasicMaterial({vertexColors:true,side:T3.BackSide})));
for(const [x,y,z,w,h] of [[0,30,0,40,8],[25,15,-20,10,20],[-25,12,20,12,14]]){const m=new T3.Mesh(new T3.PlaneGeometry(w,h),new T3.MeshBasicMaterial({color:0xffffff,side:T3.DoubleSide})); m.position.set(x,y,z); m.lookAt(0,0,0); es.add(m);}
const pm=new T3.PMREMGenerator(R); S.environment=pm.fromScene(es,0.02).texture;
const sun=new T3.DirectionalLight(0xfff4e6,1.6); sun.position.set(6,10,4); sun.castShadow=true; sun.shadow.mapSize.set(4096,4096); sun.shadow.radius=4; sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.02; Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4}); S.add(sun); S.add(new T3.HemisphereLight(0xdde6ef,0x5a554e,0.35));
const gnd=new T3.Mesh(new T3.CircleGeometry(30,64),new T3.MeshStandardMaterial({color:0x6d6a66,roughness:0.9})); gnd.rotation.x=-Math.PI/2; gnd.receiveShadow=true; S.add(gnd);
const cam=new T3.PerspectiveCamera(30,1200/700,0.1,100); window.views={nose:[4.6,0.95,1.2],wing:[3.6,0.9,2.6],quarter:[-3.4,1.0,2.8],f34c:[4.4,1.3,3.4],r34c:[-4.4,1.5,3.6],f34:[6.2,1.7,5.0],r34:[-6.2,1.9,5.2],side:[0.01,1.0,11],front:[10,1.0,0.01],rear:[-10,1.2,0.01],close:[3.2,0.75,2.2],top:[0.01,12,0.02]};
window.shot=(k,col)=>{const v=views[k]; cam.position.set(...v); cam.lookAt(0,0.62,0); if(k==='close')cam.lookAt(1.6,0.6,0.6); if(k==='nose')cam.lookAt(2.2,0.7,0.2); if(k==='wing')cam.lookAt(1.2,0.7,0.7); if(k==='quarter')cam.lookAt(-1.3,0.8,0.7); R.render(S,cam); return R.domElement.toDataURL('image/png');};
(()=>{const _L=new T3.GLTFLoader(); if(window.MeshoptDecoder)_L.setMeshoptDecoder(MeshoptDecoder); return _L})().load(location.hash.slice(1)||'mira.glb',g=>{g.scene.traverse(o=>{if(o.isMesh){o.castShadow=new URLSearchParams(location.search).get('ns')!=='1' && !((new URLSearchParams(location.search).get('nsm')||'~').split(',').some(n=>(Array.isArray(o.material)?o.material:[o.material]).some(m=>m.name===n)));o.receiveShadow=true; const ms=Array.isArray(o.material)?o.material:[o.material]; ms.forEach(m=>{if(m.name==='Paint'){m.color.setHex(+(new URLSearchParams(location.search).get('c')||0xd4583e)).convertSRGBToLinear(); m.envMapIntensity=1.2}})} if(o.name==='LOD1')o.visible=new URLSearchParams(location.search).get('far')==='1'; if(o.name==='LOD0')o.visible=new URLSearchParams(location.search).get('far')!=='1';}); S.add(g.scene); window.ready=1;});
</script></body></html>
